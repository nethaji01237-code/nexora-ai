
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: nexora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora_user -d nexora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
